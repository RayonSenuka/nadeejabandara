<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reach Out · NADEEJA</title>
    <link rel="stylesheet" href="css/style.css?v=20261125-36">
  </head>
  <body>
    <div class="wrap">
      <nav id="site-nav"></nav>
      <main class="standalone-page">
        <h2>Get in Touch</h2>
        <p class="sub">Sponsorships, collaborations or just a hello.</p>
        <div class="cgrid">
          <form id="contact-form">
            <label for="name">Your name</label>
            <input id="name" name="name" type="text" required>
            <label for="email">Your email</label>
            <input id="email" name="email" type="email" required>
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
            <div class="btns">
              <button class="btn p" type="submit">Send message</button>
            </div>
            <p class="status" id="status"></p>
          </form>
          <aside class="contact-details" aria-label="Contact details">
            <a class="contact-email" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=mrnadeeja%40gmail.com" target="_blank" rel="noopener noreferrer">
              <span class="contact-email-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 5.5h18v13H3zM3.5 6l8.5 7 8.5-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </span>
              <span>mrnadeeja@gmail.com</span>
            </a>
            <div class="contact-socials" aria-label="Social media">
              <a href="https://youtube.com/@nadeejabandara" aria-label="YouTube" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="2.5" y="5.5" width="19" height="13" rx="4" fill="currentColor"></rect>
                  <path d="M10 9v6l5-3z" fill="var(--social-cutout)"></path>
                </svg>
              </a>
              <a href="https://www.instagram.com/nadeejabandara" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="2"></rect>
                  <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle>
                  <circle cx="17.5" cy="6.8" r="1.2" fill="currentColor"></circle>
                </svg>
              </a>
              <a href="https://tiktok.com/@nadeeja.bandara" aria-label="TikTok" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M14 3v11.2a3.3 3.3 0 1 1-3.1-3.3" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                  <path d="M14 3c.5 3.1 2.2 4.8 5 5.2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></path>
                </svg>
              </a>
              <a href="https://facebook.com/nadeejabandaraonfb" aria-label="Facebook" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.6 1.6-1.6h1.7V3.8c-.3 0-1.4-.1-2.6-.1-2.6 0-4.4 1.6-4.4 4.5V10H7v3h2.8v8z" fill="currentColor"></path>
                </svg>
              </a>
            </div>
          </aside>
        </div>
      </main>
      <footer id="site-footer"></footer>
    </div>
    <script src="js/layout.js?v=20261125-3"></script>
